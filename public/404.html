<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <title>Página não encontrada | Leandro Severo</title>
  <link rel="icon" href="data:,">
  <script>
    // Mesmo tema e idioma escolhidos no site (padrão: escuro e português)
    try {
      document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');
      var lang = localStorage.getItem('lang') || ((navigator.language || '').toLowerCase().indexOf('en') === 0 ? 'en' : 'pt-BR');
      document.documentElement.lang = lang;
    } catch (e) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  <style>
    :root {
      --bg: #f0f4f8; --card: rgba(255, 255, 255, 0.6); --border: rgba(26, 95, 168, 0.18);
      --fg: #1a2636; --muted: #4a6080; --primary: #1a5fa8; --primary-fg: #ffffff;
    }
    [data-theme="dark"] {
      --bg: #04060f; --card: rgba(255, 255, 255, 0.055); --border: rgba(255, 255, 255, 0.13);
      --fg: #f0f4ff; --muted: rgba(240, 244, 255, 0.72); --primary: #4fd1c5; --primary-fg: #04060f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      color: var(--fg); background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 60% at 10% 20%, rgba(79, 209, 197, 0.08) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 90% 80%, rgba(124, 106, 247, 0.07) 0%, transparent 55%);
    }
    main {
      width: 100%; max-width: 440px; padding: 40px 32px; text-align: center;
      border: 1px solid var(--border); border-radius: 24px; background-color: var(--card);
      backdrop-filter: blur(16px) saturate(170%); -webkit-backdrop-filter: blur(16px) saturate(170%);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 8px 32px rgba(0, 0, 0, 0.25);
    }
    .code { font-family: 'Courier New', Courier, monospace; font-size: 0.8rem; letter-spacing: 0.15em; color: var(--primary); }
    h1 { margin-top: 12px; font-size: 1.75rem; line-height: 1.2; }
    p { margin-top: 12px; line-height: 1.6; color: var(--muted); }
    a.btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 44px; margin-top: 28px; padding: 0 22px;
      border-radius: 12px; background-color: var(--primary); color: var(--primary-fg);
      font-weight: 600; font-size: 0.95rem; text-decoration: none;
    }
    a.btn:hover { opacity: 0.9; }
    a.btn:focus-visible { outline: 2px solid var(--primary); outline-offset: 3px; }
    [data-lang], a.btn[data-lang] { display: none; }
    html[lang="pt-BR"] [data-lang="pt-BR"], html[lang="en"] [data-lang="en"] { display: block; }
    html[lang="pt-BR"] a.btn[data-lang="pt-BR"], html[lang="en"] a.btn[data-lang="en"] { display: inline-flex; }
  </style>
</head>
<body>
  <main>
    <p class="code">404</p>
    <h1 data-lang="pt-BR">Página não encontrada</h1>
    <h1 data-lang="en">Page not found</h1>
    <p data-lang="pt-BR">O endereço que você acessou não existe ou foi movido.</p>
    <p data-lang="en">The address you tried to open does not exist or has moved.</p>
    <a class="btn" href="/" data-lang="pt-BR">Voltar ao início</a>
    <a class="btn" href="/" data-lang="en">Back to home</a>
  </main>
  <script>
    try { document.title = document.documentElement.lang === 'en' ? 'Page not found | Leandro Severo' : 'Página não encontrada | Leandro Severo'; } catch (e) {}
  </script>
</body>
</html>
